<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports World Cup Hub | Complete Match & Player Statistics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 25, 41, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-gold: #fbbf24;
      --accent-emerald: #10b981;
      --accent-blue: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 50px;
      position: relative;
    }

    /* Static hero background (100% crystal clear view, zero blur) */
    .hero-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
      pointer-events: none;
      background: transparent;
    }

    .hero-bg img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* fit screen */
      object-position: center center;
      opacity: 1;
      /* 100% maximum clarity, no transparency dimming */
      filter: none !important;
      /* zero blur */
      -webkit-filter: none !important;
    }

    /* Dynamic background setup for landing page and sport stadiums */
    body.in-app .hero-bg {
      background: var(--bg-dark);
    }

    body.in-app .hero-bg img {
      display: block;
      opacity: 0.9;
    }


    header {
      text-align: center;
      padding: 40px 20px 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.12);
      color: var(--accent-gold);
      border: 1px solid rgba(251, 191, 36, 0.3);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .api-status {
      display: inline-block;
      font-size: 0.75rem;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
      margin-left: 8px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #e5e7eb 50%, var(--accent-gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 25px 0;
      flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border-color: #3b82f6;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
    }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .search-box input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      width: 280px;
      outline: none;
    }

    .search-box input:focus {
      border-color: var(--accent-blue);
    }

    .format-filters {
      display: flex;
      gap: 8px;
    }

    .filter-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .filter-chip.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 22px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid #e6ff00;
      /* Fluorescent Yellow */
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.35s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    /* 3D Revolving Trophy System with Fluorescent Yellow Glow */
    .trophy-revolve-stage {
      perspective: 800px;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: absolute;
      right: 15px;
      bottom: 10px;
      width: 90px;
      height: 125px;
      z-index: 2;
    }

    .trophy-revolve-3d {
      width: 100%;
      height: 98px;
      position: relative;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .trophy-revolve-3d img {
      max-height: 90px;
      max-width: 76px;
      object-fit: contain;
      /* Yellow Slight Fluorescent Outline & Glow */
      filter: drop-shadow(0 0 5px #e6ff00) drop-shadow(0 0 12px rgba(230, 255, 0, 0.85)) drop-shadow(0 6px 12px rgba(0, 0, 0, 0.9));
      backface-visibility: visible;
      pointer-events: none;
    }

    /* Static label outside 3D spinning container */
    .static-trophy-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      font-size: 0.58rem;
      font-weight: 800;
      color: #e6ff00;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-align: center;
      line-height: 1;
      text-shadow: 0 0 6px rgba(230, 255, 0, 0.8), 0 2px 4px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 5;
    }

    @keyframes spinTrophy3D {
      0% {
        transform: rotateY(0deg);
      }

      25% {
        transform: rotateY(90deg) scale(0.92);
      }

      50% {
        transform: rotateY(180deg) scale(1);
      }

      75% {
        transform: rotateY(270deg) scale(0.92);
      }

      100% {
        transform: rotateY(360deg);
      }
    }

    /* Fluorescent Yellow Pedestal Ring */
    .trophy-pedestal-ring {
      position: absolute;
      bottom: 16px;
      width: 62px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(230, 255, 0, 0.65) 0%, rgba(230, 255, 0, 0.15) 65%, transparent 85%);
      box-shadow: 0 0 16px #e6ff00, 0 0 28px rgba(230, 255, 0, 0.5);
      transform: rotateX(70deg);
      z-index: 1;
      animation: pedestalPulse 2.5s ease-in-out infinite alternate;
    }

    @keyframes pedestalPulse {
      0% {
        box-shadow: 0 0 10px #e6ff00, 0 0 18px rgba(230, 255, 0, 0.4);
        opacity: 0.7;
      }

      100% {
        box-shadow: 0 0 22px #e6ff00, 0 0 35px rgba(230, 255, 0, 0.85);
        opacity: 1;
      }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .year-tag {
      font-family: 'Outfit', sans-serif;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .fmt-badge {
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .teams-row {
      margin-bottom: 16px;
    }

    .winner {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Waving Flag 3D Animation System */
    .waving-flag-wrapper {
      display: inline-flex;
      align-items: center;
      position: relative;
      perspective: 400px;
      height: 32px;
      vertical-align: middle;
      flex-shrink: 0;
    }

    .waving-flag-wrapper.large {
      height: 48px;
    }

    .flag-pole {
      width: 4px;
      height: 34px;
      background: linear-gradient(180deg, #ffe066 0%, #d4af37 35%, #8a6b14 70%, #3a2e0a 100%);
      border-radius: 2px 2px 1px 1px;
      box-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
      position: relative;
      z-index: 3;
      flex-shrink: 0;
    }

    .flag-pole.large {
      width: 5px;
      height: 52px;
    }

    .flag-pole::before {
      content: '';
      position: absolute;
      top: -5px;
      left: -2px;
      width: 8px;
      height: 8px;
      background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ffd700 60%, #b8860b 100%);
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.9);
    }

    .flag-pole.large::before {
      top: -6px;
      left: -2.5px;
      width: 10px;
      height: 10px;
    }

    .waving-flag {
      width: 44px;
      height: 27px;
      position: relative;
      transform-origin: left center;
      transform-style: preserve-3d;
      animation: flagWave 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
      border-radius: 0 3px 3px 0;
      overflow: hidden;
      box-shadow: 3px 5px 12px rgba(0, 0, 0, 0.6);
      background: #111;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-left: none;
    }

    .waving-flag.large {
      width: 72px;
      height: 44px;
      border-radius: 0 5px 5px 0;
    }

    .waving-flag img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .waving-flag::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg,
          rgba(255, 255, 255, 0.45) 0%,
          rgba(0, 0, 0, 0.4) 22%,
          rgba(255, 255, 255, 0.4) 48%,
          rgba(0, 0, 0, 0.5) 72%,
          rgba(255, 255, 255, 0.3) 100%);
      background-size: 200% 100%;
      animation: waveShading 2.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite alternate;
      pointer-events: none;
      mix-blend-mode: overlay;
    }

    @keyframes flagWave {
      0% {
        transform: rotateY(0deg) skewY(0deg) scaleX(1);
      }

      25% {
        transform: rotateY(22deg) skewY(-5deg) scaleX(0.94);
      }

      50% {
        transform: rotateY(-16deg) skewY(6deg) scaleX(1.03);
      }

      75% {
        transform: rotateY(18deg) skewY(-4deg) scaleX(0.96);
      }

      100% {
        transform: rotateY(-10deg) skewY(3deg) scaleX(1);
      }
    }

    @keyframes waveShading {
      0% {
        background-position: 0% 0%;
      }

      100% {
        background-position: 100% 0%;
      }
    }

    .card:hover .waving-flag {
      animation-duration: 1.5s;
    }

    .card:hover .waving-flag::after {
      animation-duration: 1.5s;
    }

    .runner-up {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .scores-box {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      padding: 8px 12px;
      margin: 10px 0;
      font-size: 0.85rem;
    }

    .score-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .score-line:last-child {
      margin-bottom: 0;
    }

    .venue-info {
      font-size: 0.82rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--card-border);
      padding-top: 12px;
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      max-width: 900px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.3rem;
    }

    .team-tabs {
      display: flex;
      gap: 10px;
      margin: 20px 0 15px;
    }

    .team-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .team-tab-btn.active {
      background: var(--accent-gold);
      color: #000;
      border-color: var(--accent-gold);
    }

    .stats-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
      font-size: 0.85rem;
    }

    .stats-table th {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      text-align: left;
      padding: 10px;
      font-weight: 600;
    }

    .stats-table td {
      padding: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stats-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    .loading {
      text-align: center;
      padding: 60px;
      color: var(--text-muted);
      font-size: 1.2rem;
    }

    .stats-dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
    }

    .stat-card h3 {
      font-family: 'Outfit', sans-serif;
      color: var(--accent-gold);
      margin-bottom: 15px;
      font-size: 1.3rem;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* ===== KickBat Landing Page ===== */
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 14px 20px 40px;
      gap: 4px;
    }

    h1.brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(4rem, 12vw, 8.5rem);
      font-weight: 800;
      letter-spacing: 3px;
      line-height: 1;
      background: none;
      -webkit-background-clip: border-box;
      background-clip: border-box;
      color: #ffffff;
      -webkit-text-fill-color: #ffffff;
      -webkit-text-stroke: 3px #ffcc00;
      /* fluorescent dark yellow outline */
      paint-order: stroke fill;
      text-shadow: 0 0 18px rgba(255, 204, 0, 0.6), 0 6px 30px rgba(0, 0, 0, 0.7);
      margin: 0;
      animation: brandGlow 3s ease-in-out infinite alternate;
    }

    @keyframes brandGlow {
      from {
        text-shadow: 0 0 12px rgba(255, 204, 0, 0.4), 0 6px 30px rgba(0, 0, 0, 0.7);
      }

      to {
        text-shadow: 0 0 30px rgba(255, 204, 0, 0.9), 0 6px 30px rgba(0, 0, 0, 0.7);
      }
    }

    .brand-motto,
    .app-motto {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffffff;
      -webkit-text-stroke: 2px #1f51ff;
      /* fluorescent dark blue outline */
      paint-order: stroke fill;
      text-shadow: 0 0 10px rgba(31, 81, 255, 0.85);
    }

    .brand-motto {
      font-size: clamp(1.05rem, 2.2vw, 1.4rem);
      margin-bottom: 26px;
    }

    .landing-choices {
      display: flex;
      flex-direction: column;
      /* Cricket above Football */
      align-items: center;
      gap: 18px;
    }

    .choice-card {
      width: 108px;
      height: 92px;
      padding: 8px 6px 6px;
      border-radius: 12px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(12px);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    /* ICC Theme for Cricket Tab */
    .choice-cricket {
      background: linear-gradient(135deg, rgba(4, 18, 53, 0.92) 0%, rgba(10, 37, 97, 0.92) 100%);
      border: 2px solid #00d2ff;
      /* ICC Cyan */
      box-shadow: 0 0 14px rgba(0, 210, 255, 0.65), inset 0 0 8px rgba(0, 210, 255, 0.3);
    }

    .choice-cricket:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: #ffffff;
      box-shadow: 0 0 24px rgba(0, 210, 255, 0.95);
    }

    /* FIFA Theme for Football Tab */
    .choice-football {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(30, 41, 59, 0.92) 100%);
      border: 2px solid #fbbf24;
      /* FIFA Gold */
      box-shadow: 0 0 14px rgba(251, 191, 36, 0.65), inset 0 0 8px rgba(251, 191, 36, 0.3);
    }

    .choice-football:hover {
      transform: translateY(-4px) scale(1.05);
      border-color: #ffffff;
      box-shadow: 0 0 24px rgba(251, 191, 36, 0.95);
    }

    .choice-logo {
      width: 100%;
      max-width: 84px;
      height: 50px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
      transition: transform 0.3s ease;
    }

    .choice-card:hover .choice-logo {
      transform: scale(1.1);
    }

    .choice-name {
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Compact header inside the app view */
    .home-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .home-btn:hover {
      background: rgba(255, 230, 0, 0.18);
      border-color: #ffe600;
      color: #ffe600;
    }

    h2.app-brand {
      font-family: 'Outfit', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffe600;
      text-shadow: 0 0 14px rgba(255, 230, 0, 0.5);
    }

    .app-motto {
      font-size: 1rem;
      letter-spacing: 3px;
    }

    header {
      position: relative;
    }

    /* ===== Exit button (bottom-right of front page) ===== */
    .exit-btn {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 5;
      padding: 10px 24px;
      border-radius: 10px;
      border: 2px solid #39ff14;
      background: #063d14;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(57, 255, 20, 0.75);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .exit-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 26px rgba(57, 255, 20, 1);
    }

    .goodbye-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(5, 10, 20, 0.92);
      animation: goodbyeFade 0.5s ease;
    }

    .goodbye-overlay.show {
      display: flex;
    }

    .goodbye-msg {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 800;
      text-align: center;
      padding: 20px;
      color: #ffffff;
      -webkit-text-stroke: 2px #1f51ff;
      paint-order: stroke fill;
      text-shadow: 0 0 18px rgba(31, 81, 255, 0.9);
    }

    @keyframes goodbyeFade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Hover Popup Box for Player Stats & Photo (Hover Only) */
    .player-hover-popup {
      position: fixed;
      z-index: 10000;
      width: 340px;
      background: rgba(8, 14, 28, 0.96);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(251, 191, 36, 0.6);
      border-radius: 18px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.9), 0 0 28px rgba(251, 191, 36, 0.3);
      padding: 18px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(8px) scale(0.95);
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .player-hover-popup.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .player-popup-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .player-popup-photo-box {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent-gold);
      box-shadow: 0 0 18px rgba(251, 191, 36, 0.5), 0 4px 12px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
      background: #1e293b;
    }

    .player-popup-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .player-popup-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
      margin: 0 0 4px 0;
      line-height: 1.2;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    }

    .player-popup-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .player-popup-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .player-popup-stat-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }

    .player-popup-stat-val {
      font-family: 'Outfit', sans-serif;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .player-popup-stat-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .player-popup-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.18);
      color: var(--accent-gold);
      border: 1px solid rgba(251, 191, 36, 0.35);
      font-size: 0.78rem;
      font-weight: 700;
      margin-top: 8px;
    }

    .player-hover-item {
      cursor: pointer;
      color: #fef08a;
      border-bottom: 1px dashed rgba(251, 191, 36, 0.6);
      transition: all 0.2s ease;
      display: inline-block;
    }

    .player-hover-item:hover {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.9);
      border-bottom-color: #ffffff;
    }

    /* Flag Carousel Animated Loading Theme */
    .flag-loader-container {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      min-height: 350px;
      text-align: center;
      width: 100%;
    }

    .flag-loader-stage {
      position: relative;
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    .flag-loader-glow-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 3px dashed var(--accent-gold);
      animation: ringSpin 6s linear infinite;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.5), inset 0 0 20px rgba(251, 191, 36, 0.3);
    }

    .football-mode .flag-loader-glow-ring {
      border-color: var(--accent-blue);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.5), inset 0 0 20px rgba(56, 189, 248, 0.3);
    }

    @keyframes ringSpin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .flag-loader-card {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #fff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: flagPop 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes flagPop {
      0% {
        transform: scale(0.5) rotateY(-90deg);
        opacity: 0;
      }

      50% {
        transform: scale(1.15) rotateY(15deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotateY(0deg);
        opacity: 1;
      }
    }

    .flag-loader-country-name {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-gold);
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-transform: uppercase;
      text-shadow: 0 0 16px rgba(251, 191, 36, 0.6);
    }

    .football-mode .flag-loader-country-name {
      color: var(--accent-blue);
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
    }

    .flag-loader-subtext {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .flag-loader-progress-bar {
      width: 240px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;
      position: relative;
    }

    .flag-loader-progress-fill {
      height: 100%;
      width: 50%;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
      animation: progressSweep 1.2s ease-in-out infinite;
    }

    .football-mode .flag-loader-progress-fill {
      background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
    }

    @keyframes progressSweep {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(200%);
      }
    }

    /* Match Detail Rolling Ball Loading Animations (Scoreboard -> Stats) */
    .action-loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
      min-height: 250px;
      position: relative;
    }

    .ball-roll-stage {
      width: 280px;
      height: 120px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 15px;
    }

    .action-glow-field {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.38;
      z-index: 1;
    }

    .cricket-action .action-glow-field {
      background: #fbbf24;
    }

    .football-action .action-glow-field {
      background: #38bdf8;
    }

    .pitch-lane {
      position: absolute;
      bottom: 25px;
      width: 260px;
      height: 3px;
      border-radius: 3px;
      z-index: 2;
    }

    .cricket-action .pitch-lane {
      background: linear-gradient(90deg, transparent, rgba(251, 191, 36, 0.6) 20%, rgba(251, 191, 36, 0.6) 80%, transparent);
      box-shadow: 0 0 8px rgba(251, 191, 36, 0.4);
    }

    .football-action .pitch-lane {
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.6) 20%, rgba(56, 189, 248, 0.6) 80%, transparent);
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
    }

    /* Rolling Cricket Ball */
    .rolling-cricket-ball-wrapper {
      position: absolute;
      bottom: 24px;
      left: 0;
      z-index: 4;
      animation: cricketBallRollIn 1.1s cubic-bezier(0.1, 0.85, 0.25, 1) infinite;
    }

    .rolling-cricket-ball {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6b6b 0%, #dc2626 50%, #7f1d1d 100%);
      box-shadow: inset -4px -4px 8px rgba(0, 0, 0, 0.6), 0 0 16px rgba(251, 191, 36, 0.9), 0 0 25px rgba(220, 38, 38, 0.7);
      position: relative;
      overflow: hidden;
      animation: ballSpin 1.1s linear infinite;
    }

    .rolling-cricket-ball::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 3px dashed #ffffff;
      border-radius: 50%;
      opacity: 0.9;
    }

    .rolling-cricket-ball::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: #ffffff;
      box-shadow: 0 0 4px #ffffff;
      transform: translateY(-50%);
    }

    @keyframes cricketBallRollIn {
      0% {
        transform: translateX(-60px);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      80% {
        transform: translateX(115px);
        opacity: 1;
      }

      100% {
        transform: translateX(290px);
        opacity: 0;
      }
    }

    @keyframes ballSpin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(720deg);
      }
    }

    /* Rolling Football */
    .rolling-football-wrapper {
      position: absolute;
      bottom: 24px;
      left: 0;
      z-index: 4;
      animation: footballRollIn 1.1s cubic-bezier(0.1, 0.85, 0.25, 1) infinite;
    }

    .rolling-football {
      width: 48px;
      height: 48px;
      font-size: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.9)) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.8));
      animation: ballSpin 1.1s linear infinite;
    }

    @keyframes footballRollIn {
      0% {
        transform: translateX(-60px);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      80% {
        transform: translateX(115px);
        opacity: 1;
      }

      100% {
        transform: translateX(290px);
        opacity: 0;
      }
    }

    /* Dynamic Shadow Underneath Rolling Ball */
    .ball-shadow {
      position: absolute;
      bottom: 18px;
      left: 0;
      width: 44px;
      height: 10px;
      background: rgba(0, 0, 0, 0.75);
      border-radius: 50%;
      filter: blur(4px);
      z-index: 3;
      animation: shadowFollow 1.1s cubic-bezier(0.1, 0.85, 0.25, 1) infinite;
    }

    @keyframes shadowFollow {
      0% {
        transform: translateX(-60px) scaleX(0.5);
        opacity: 0;
      }

      20% {
        opacity: 0.85;
      }

      80% {
        transform: translateX(115px) scaleX(1);
        opacity: 0.85;
      }

      100% {
        transform: translateX(290px) scaleX(0.5);
        opacity: 0;
      }
    }

    .action-loader-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 10px;
      margin-bottom: 12px;
      z-index: 2;
    }

    .cricket-action .action-loader-title {
      color: var(--accent-gold);
      text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
    }

    .football-action .action-loader-title {
      color: var(--accent-blue);
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
    }

    .action-loader-bar {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .action-loader-fill {
      height: 100%;
      width: 60%;
      position: absolute;
      animation: actionProgressSweep 1.0s ease-in-out infinite;
    }

    .cricket-action .action-loader-fill {
      background: linear-gradient(90deg, transparent, #fbbf24, transparent);
    }

    .football-action .action-loader-fill {
      background: linear-gradient(90deg, transparent, #38bdf8, transparent);
    }

    @keyframes actionProgressSweep {
      0% {
        transform: translateX(-100%);
      }

      100% {
        transform: translateX(200%);
      }
    }
  </style>
</head>

<body>

  <!-- Floating Player Hover Popup Card (Hover Only, Auto-hides on leave) -->
  <div class="player-hover-popup" id="playerHoverPopup" aria-hidden="true"></div>

  <!-- Dynamic Background Photo (Front page / Cricket Stadium / Football Stadium) -->
  <div class="hero-bg" aria-hidden="true">
    <img src="user_hero.jpg" id="heroBgImg" alt="Sports World Cup Background">
  </div>

  <!-- LANDING PAGE: only Cricket & Football are shown -->
  <section class="landing" id="landingView">
    <h1 class="brand-title">KickBat</h1>
    <p class="brand-motto">Play Passion Power</p>

    <div class="landing-choices">
      <button class="choice-card choice-cricket" id="chooseCricket" onclick="enterSport('cricket')">
        <img src="icc_logo.png" class="choice-logo" alt="ICC Logo">
        <span class="choice-name">Cricket</span>
      </button>
      <button class="choice-card choice-football" id="chooseFootball" onclick="enterSport('football')">
        <img src="fifa_logo.png" class="choice-logo" alt="FIFA Logo">
        <span class="choice-name">Football</span>
      </button>
    </div>

    <button class="exit-btn" id="exitBtn" onclick="exitSite()">Exit</button>
  </section>

  <!-- Thank-you message shown after clicking Exit -->
  <div class="goodbye-overlay" id="goodbyeOverlay">
    <div class="goodbye-msg">Thank you for viewing our page</div>
  </div>

  <!-- APP VIEW: hidden until a sport is clicked -->
  <div id="appView" style="display:none;">
    <header style="position: relative; text-align: center; padding: 25px 20px 15px;">
      <button class="home-btn" id="homeBtn" onclick="goHome()"
        style="position: absolute; left: 20px; top: 25px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 10px 18px; border-radius: 30px; font-weight: 700; cursor: pointer; transition: all 0.3s ease;">
        ← Switch Sport
      </button>
      <div id="sportHeaderInfo">
        <!-- Filled dynamically in switchSport() -->
      </div>
    </header>

    <main class="container">
      <div class="controls-bar" id="controlsBar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Search team, venue, year or player..."
            oninput="handleSearch()">
        </div>
        <div class="format-filters" id="formatFilters">
          <span class="filter-chip active" onclick="setFormat('ALL')">ALL</span>
          <span class="filter-chip" onclick="setFormat('ODI')">ODI</span>
          <span class="filter-chip" onclick="setFormat('T20')">T20</span>
        </div>
      </div>

      <div id="gridContainer" class="grid">
        <div class="loading">Fetching statistics from backend API...</div>
      </div>
    </main>
  </div>

  <!-- Modal overlay for match detail & player stats -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <button class="close-btn" onclick="closeModalDirect()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    // Automatic API Base detection so index.html works both via http://localhost:5000 AND direct file viewing (file://...)
    const API_BASE = (window.location.protocol === 'file:' || !window.location.port)
      ? 'http://localhost:5000'
      : '';

    let currentSport = 'cricket';
    let currentFormat = 'ALL';
    let allMatches = [];
    let activeTeamTab = 'winner';
    let currentMatchData = null;

    const countryCodeMap = {
      "India": "in",
      "Australia": "au",
      "West Indies": "west-indies-flag.svg",
      "Pakistan": "pk",
      "Sri Lanka": "lk",
      "England": "gb-eng",
      "New Zealand": "nz",
      "South Africa": "za",
      "Uruguay": "uy",
      "Italy": "it",
      "West Germany": "de",
      "Germany": "de",
      "Brazil": "br",
      "Argentina": "ar",
      "France": "fr",
      "Spain": "es",
      "Netherlands": "nl",
      "Czechoslovakia": "cz",
      "Hungary": "hu",
      "Sweden": "se",
      "Croatia": "hr"
    };

    function getWavingFlagHTML(teamName, size = 'small') {
      if (!teamName) return '';
      const code = countryCodeMap[teamName] || 'un';
      const flagSrc = (code.startsWith('http') || code.startsWith('/') || code.endsWith('.svg')) ? code : `https://flagcdn.com/w80/${code}.png`;

      const isLarge = size === 'large';
      const poleClass = isLarge ? 'flag-pole large' : 'flag-pole';
      const flagClass = isLarge ? 'waving-flag large' : 'waving-flag';
      const wrapperClass = isLarge ? 'waving-flag-wrapper large' : 'waving-flag-wrapper';

      return `
        <div class="${wrapperClass}" title="${teamName} Waving Flag">
          <div class="${poleClass}"></div>
          <div class="${flagClass}">
            <img src="${flagSrc}" alt="${teamName} Flag" onerror="this.onerror=null; this.src='https://flagcdn.com/w80/un.png';">
          </div>
        </div>
      `;
    }

    function getOfficialTrophyData(match) {
      if (!match) {
        return {
          name: 'FIFA World Cup Trophy',
          formatLabel: 'FIFA Trophy',
          rawSrc: 'trophies/football_wc.png'
        };
      }

      // 1. FOOTBALL WORLD CUP
      if (!match.format || match.format === 'FIFA' || currentSport === 'football') {
        return {
          name: 'FIFA World Cup Trophy',
          formatLabel: 'FIFA Trophy',
          rawSrc: 'trophies/football_wc.png'
        };
      }

      // CRICKET
      const yr = parseInt(match.year);
      const fmt = match.format;

      // 3. T20 WORLD CUP
      if (fmt === 'T20') {
        return {
          name: "ICC Men's T20 World Cup Trophy",
          formatLabel: 'T20 Cup',
          rawSrc: 'trophies/t20_wc.png'
        };
      }

      // 4. TEST WORLD CUP
      if (fmt === 'Test') {
        return {
          name: 'ICC World Test Championship Mace',
          formatLabel: 'WTC Mace',
          rawSrc: 'trophies/test_wc.png'
        };
      }

      // 5. PRUDENTIAL WORLD CUP (1975, 1979, 1983)
      if (fmt === 'ODI' && yr <= 1983) {
        return {
          name: 'Prudential World Cup Trophy',
          formatLabel: 'Prudential Cup',
          rawSrc: 'trophies/prudential_wc.png'
        };
      }

      // 2. ODI WORLD CUP (1987 - Present)
      return {
        name: 'ICC Cricket World Cup Trophy',
        formatLabel: 'ODI Trophy',
        rawSrc: 'trophies/odi_wc.png'
      };
    }

    let flagInterval = null;

    function startFlagLoader(sport) {
      const container = document.getElementById('gridContainer');
      if (!container) return;

      if (flagInterval) clearInterval(flagInterval);

      const cricketNations = [
        { name: "India", code: "in" },
        { name: "Australia", code: "au" },
        { name: "West Indies", code: "/west-indies-flag.svg" },
        { name: "England", code: "gb-eng" },
        { name: "Pakistan", code: "pk" },
        { name: "Sri Lanka", code: "lk" },
        { name: "South Africa", code: "za" },
        { name: "New Zealand", code: "nz" }
      ];

      const footballNations = [
        { name: "Brazil", code: "br" },
        { name: "Argentina", code: "ar" },
        { name: "Germany", code: "de" },
        { name: "France", code: "fr" },
        { name: "Italy", code: "it" },
        { name: "Uruguay", code: "uy" },
        { name: "Spain", code: "es" },
        { name: "England", code: "gb-eng" },
        { name: "Croatia", code: "hr" },
        { name: "Netherlands", code: "nl" }
      ];

      const nations = sport === 'football' ? footballNations : cricketNations;
      let index = 0;
      const modeClass = sport === 'football' ? 'football-mode' : '';

      function renderFlagStep() {
        const nation = nations[index];
        const flagSrc = (nation.code.startsWith('http') || nation.code.startsWith('/') || nation.code.endsWith('.svg'))
          ? nation.code
          : `https://flagcdn.com/w160/${nation.code}.png`;

        container.innerHTML = `
          <div class="flag-loader-container ${modeClass}">
            <div class="flag-loader-stage">
              <div class="flag-loader-glow-ring"></div>
              <div class="flag-loader-card">
                <img src="${flagSrc}" alt="${nation.name}" style="width:100%; height:100%; object-fit:cover;" onerror="this.onerror=null; this.src='https://flagcdn.com/w160/un.png';">
              </div>
            </div>
            <div class="flag-loader-country-name">${nation.name}</div>
            <div class="flag-loader-subtext">
              <span>${sport === 'football' ? '⚽' : '🏏'} Loading World Cup Nations...</span>
            </div>
            <div class="flag-loader-progress-bar">
              <div class="flag-loader-progress-fill"></div>
            </div>
          </div>
        `;

        index = (index + 1) % nations.length;
      }

      renderFlagStep();
      flagInterval = setInterval(renderFlagStep, 380);
    }

    function stopFlagLoader() {
      if (flagInterval) {
        clearInterval(flagInterval);
        flagInterval = null;
      }
    }

    async function loadData() {
      const container = document.getElementById('gridContainer');
      document.getElementById('controlsBar').style.display = 'flex';

      startFlagLoader(currentSport);

      try {
        let url = `/api/${currentSport}`;
        if (currentSport === 'cricket' && currentFormat !== 'ALL') {
          url = `/api/cricket/format/${currentFormat}`;
        }

        const res = await fetch(`${API_BASE}${url}`);
        allMatches = await res.json();

        // Brief delay to showcase the smooth flag carousel animation
        await new Promise(r => setTimeout(r, 700));

        stopFlagLoader();
        renderMatches(allMatches);
      } catch (err) {
        stopFlagLoader();
        container.innerHTML = `<div class="loading" style="color: #ef4444;">Failed to fetch backend data.</div>`;
      }
    }

    function switchSport(sport) {
      currentSport = sport;
      currentFormat = 'ALL';

      const headerInfo = document.getElementById('sportHeaderInfo');
      const filterBox = document.getElementById('formatFilters');
      const bgImg = document.getElementById('heroBgImg');

      if (sport === 'cricket') {
        if (bgImg) bgImg.src = 'cricket_stadium.jpg';
        headerInfo.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:6px;">
            <img src="icc_logo.png" style="height:48px; width:auto; filter: drop-shadow(0 0 10px rgba(251,191,36,0.5));" alt="ICC Logo">

    function renderMatches(list) {
      const container = document.getElementById('gridContainer');
      if (!list || list.length === 0) {

      container.innerHTML = list.map(m => {
        const trophy = getOfficialTrophyData(m);
        return `
          <div class="card" onclick="openDetails('${m.year}', '${m.format || ''}')">
            <div class="trophy-revolve-stage" title="${trophy.name}">
              <div class="trophy-pedestal-ring"></div>
              <div class="trophy-revolve-3d">
                <img src="${trophy.rawSrc}" alt="${trophy.name}" />
              </div>
              <span class="static-trophy-label">${trophy.formatLabel}</span>

            <div class="card-content" style="padding-right: 90px;">
              <div class="card-header">
                <span class="year-tag">${m.year}</span>
                <span class="fmt-badge">${m.format ? m.format + ' World Cup' : 'FIFA World Cup'}</span>
              </div>
              <div class="teams-row">
                <div class="winner">
                  <span style="font-size: 1.2rem;">🏆</span>
                  ${getWavingFlagHTML(m.winner, 'small')}

    function handleSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allMatches.filter(m =>
        m.year.toString().includes(query) ||
        m.winner.toLowerCase().includes(query) ||
        m.runnerUp.toLowerCase().includes(query) ||
        (m.country && m.country.toLowerCase().includes(query)) ||
        (m.manOfTheMatch && m.manOfTheMatch.toLowerCase().includes(query))
      );
      renderMatches(filtered);
    }

    async function openDetails(year, format) {
      const overlay = document.getElementById('modalOverlay');
      const content = document.getElementById('modalContent');

      if (currentSport === 'cricket') {
        content.innerHTML = `
          <div class="action-loader-container cricket-action">
            <div class="ball-roll-stage">
              <div class="action-glow-field"></div>
              <div class="pitch-lane"></div>
              <div class="ball-shadow"></div>
              <div class="rolling-cricket-ball-wrapper">
                <div class="rolling-cricket-ball"></div>
              </div>
            </div>
            <div class="action-loader-bar"><div class="action-loader-fill"></div></div>
          </div>
        `;
      } else {
        content.innerHTML = `
          <div class="action-loader-container football-action">
            <div class="ball-roll-stage">
              <div class="action-glow-field"></div>
              <div class="pitch-lane"></div>
              <div class="ball-shadow"></div>
              <div class="rolling-football-wrapper">
                <div class="rolling-football">⚽</div>
              </div>
            </div>
            <div class="action-loader-bar"><div class="action-loader-fill"></div></div>
          </div>
        `;
      }

      overlay.style.display = 'flex';

      try {
        let url = currentSport === 'football'
          ? `/api/football/${year}`
          : `/api/cricket/${format}/${year}`;

        const [res] = await Promise.all([
          fetch(`${API_BASE}${url}`),
          new Promise(r => setTimeout(r, 650))
        ]);

        currentMatchData = await res.json();
        activeTeamTab = 'winner';
        renderModalContent();
      } catch (e) {
        content.innerHTML = `<p style="color: red; text-align: center; padding: 30px;">Failed to load statistics from backend database.</p>`;
      }
    }

    function getPlayerHoverAttrs(playerObj, teamName, isCricket = true) {
      const pName = typeof playerObj === 'string' ? playerObj : playerObj.name;
      const payload = {
        name: pName,
        team: teamName || '',
        role: playerObj.role || playerObj.position || '',
        isCaptain: playerObj.isCaptain || false,
        batting: playerObj.batting || null,
        bowling: playerObj.bowling || null,
        goals: playerObj.goals || 0,
        assists: playerObj.assists || 0,
        number: playerObj.number || '',
        position: playerObj.position || '',
        isMom: playerObj.isMom || false,
        isGoldenBoot: playerObj.isGoldenBoot || false
      };
      const str = encodeURIComponent(JSON.stringify(payload));
      return `class="player-hover-item" onmouseenter="showPlayerHoverCard(event, '${str}')" onmousemove="movePlayerHoverCard(event)" onmouseleave="hidePlayerHoverCard()"`;
    }

      `;

      popup.classList.add('show');
      movePlayerHoverCard(event);
    }

    function movePlayerHoverCard(event) {
      const popup = document.getElementById('playerHoverPopup');
      if (!popup.classList.contains('show')) return;

      const x = event.clientX;
      const y = event.clientY;
      const w = popup.offsetWidth || 310;
      const h = popup.offsetHeight || 180;
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      let posX = x + 16;
      let posY = y + 16;

      if (posX + w > winW - 10) posX = x - w - 16;
      if (posY + h > winH - 10) posY = y - h - 16;

      popup.style.left = `${Math.max(10, posX)}px`;
      popup.style.top = `${Math.max(10, posY)}px`;
    }

    let fetchedPlayerPhotos = {};
    fetch(`${API_BASE}/player_photos.json`)
      .then(r => r.json())
      .then(data => { fetchedPlayerPhotos = data; })
      .catch(() => { });

    async function resolvePlayerPhoto(pName, imgElementId) {
      if (fetchedPlayerPhotos[pName]) {
        const el = document.getElementById(imgElementId);
        if (el) el.src = fetchedPlayerPhotos[pName];
        return;
      }
      try {
        const clean = pName.split(' (')[0].trim();
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(clean)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.thumbnail && data.thumbnail.source) {
            let src = data.thumbnail.source;
            src = src.replace('/330px-', '/500px-').replace('/220px-', '/500px-');
            fetchedPlayerPhotos[pName] = src;
            const el = document.getElementById(imgElementId);
            if (el) el.src = src;
          }
        }
      } catch (e) { }
    }

    function showPlayerHoverCard(event, playerJSON) {
      const popup = document.getElementById('playerHoverPopup');
      const p = typeof playerJSON === 'string' ? JSON.parse(decodeURIComponent(playerJSON)) : playerJSON;
      const photoImgId = `hover_photo_${Math.random().toString(36).substr(2, 6)}`;

      const photoSrc = fetchedPlayerPhotos[p.name] || playerPhotoMap[p.name] || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&size=300&background=1e293b&color=fbbf24&font-size=0.36&bold=true`;
      const flagHTML = p.team ? getWavingFlagHTML(p.team, 'small') : '';

      let statsGrid = '';
      if (currentSport === 'cricket') {
        const r = p.batting ? p.batting.runs : (p.runs !== undefined ? p.runs : '-');
        const b = p.batting ? p.batting.balls : (p.balls !== undefined ? p.balls : '-');
        const sr = p.batting ? p.batting.strikeRate : (p.strikeRate !== undefined ? p.strikeRate : '-');
        const wk = p.bowling ? p.bowling.wickets : (p.wickets !== undefined ? p.wickets : 0);

        statsGrid = `
          <div class="player-popup-grid">
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${r}</div>
              <div class="player-popup-stat-lbl">Runs</div>
            </div>
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${sr}</div>
              <div class="player-popup-stat-lbl">Strike Rate</div>
            </div>
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${wk}</div>
              <div class="player-popup-stat-lbl">Wickets</div>
            </div>
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${b}</div>
              <div class="player-popup-stat-lbl">Balls</div>
            </div>
          </div>
        `;
      } else {
        statsGrid = `
          <div class="player-popup-grid">
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${p.goals !== undefined ? p.goals : 0}</div>
              <div class="player-popup-stat-lbl">Goals</div>
            </div>
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${p.assists !== undefined ? p.assists : 0}</div>
              <div class="player-popup-stat-lbl">Assists</div>
            </div>
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${p.number ? '#' + p.number : 'Squad'}</div>
              <div class="player-popup-stat-lbl">Jersey #</div>
            </div>
            <div class="player-popup-stat-box">
              <div class="player-popup-stat-val">${p.position || 'Player'}</div>
              <div class="player-popup-stat-lbl">Position</div>
            </div>
          </div>
        `;
      }

      let badgeHTML = '';
      if (p.isCaptain) badgeHTML += `<span class="player-popup-badge">👑 Captain</span>`;
      if (p.isMom) badgeHTML += `<span class="player-popup-badge">⭐ Man of Match</span>`;
      if (p.isGoldenBoot) badgeHTML += `<span class="player-popup-badge">👟 Golden Boot</span>`;

      popup.innerHTML = `
        <div class="player-popup-header">
          <div class="player-popup-photo-box">
            <img id="${photoImgId}" src="${photoSrc}" alt="${p.name}" class="player-popup-photo" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&size=300&background=1e293b&color=fbbf24&font-size=0.36&bold=true';">
          </div>
          <div>
            <h3 class="player-popup-title">${p.name}</h3>
            <div class="player-popup-meta">
              ${flagHTML}
              <span style="font-weight:600;">${p.team || ''}</span>
              ${p.role ? `&bull; <span>${p.role}</span>` : ''}
            </div>
          </div>
        </div>
        ${statsGrid}
        ${badgeHTML ? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">${badgeHTML}</div>` : ''}
      `;

      popup.classList.add('show');
      movePlayerHoverCard(event);
      resolvePlayerPhoto(p.name, photoImgId);
    }

    function movePlayerHoverCard(event) {
      const popup = document.getElementById('playerHoverPopup');
      if (!popup.classList.contains('show')) return;

      const x = event.clientX;
      const y = event.clientY;
      const w = popup.offsetWidth || 340;
      const h = popup.offsetHeight || 190;
      const winW = window.innerWidth;
      const winH = window.innerHeight;

      let posX = x + 16;
      let posY = y + 16;

      if (posX + w > winW - 10) posX = x - w - 16;
      if (posY + h > winH - 10) posY = y - h - 16;

      popup.style.left = `${Math.max(10, posX)}px`;
      popup.style.top = `${Math.max(10, posY)}px`;
    }

    function hidePlayerHoverCard() {
      const popup = document.getElementById('playerHoverPopup');
      if (popup) popup.classList.remove('show');
    }

    // Auto-hide popup on scroll or leaving document window
    window.addEventListener('scroll', hidePlayerHoverCard);
    document.addEventListener('mouseleave', hidePlayerHoverCard);

    // Landing page navigation: details stay hidden until a sport is chosen
    function enterSport(sport) {
      hidePlayerHoverCard();
      document.getElementById('landingView').style.display = 'none';
      document.getElementById('appView').style.display = 'block';
      document.body.classList.add('in-app');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      switchSport(sport);
    }

    function goHome() {
      hidePlayerHoverCard();
      const bgImg = document.getElementById('heroBgImg');
      if (bgImg) bgImg.src = 'user_hero.jpg';
      document.getElementById('appView').style.display = 'none';
      document.body.classList.remove('in-app');
      document.getElementById('landingView').style.display = 'flex';
      document.getElementById('modalOverlay').style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Exit: show thank-you message, then return to the browser's default (blank) page
    function exitSite() {
      document.getElementById('goodbyeOverlay').classList.add('show');
      setTimeout(() => {
        window.close();
        window.location.replace('about:blank');
      }, 2500);
    }
  </script>
</body>

</html>
