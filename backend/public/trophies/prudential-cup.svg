<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="pruSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#ECEFF1"/>
      <stop offset="70%" stop-color="#B0BEC5"/>
      <stop offset="100%" stop-color="#455A64"/>
    </linearGradient>
    <linearGradient id="woodPedestal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3E2723"/>
      <stop offset="50%" stop-color="#5D4037"/>
      <stop offset="100%" stop-color="#271510"/>
    </linearGradient>
    <filter id="shadowPru" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadowPru)">
    <!-- Dark Wood Pedestal -->
    <rect x="45" y="250" width="110" height="26" rx="4" fill="url(#woodPedestal)"/>
    <rect x="55" y="235" width="90" height="15" fill="url(#pruSilver)"/>
    <!-- Engraved Gold Plaque -->
    <rect x="70" y="255" width="60" height="16" rx="2" fill="#FFD54F" stroke="#B78103" stroke-width="1"/>

    <!-- Urn Body -->
    <path d="M62,235 C48,180 42,120 100,90 C158,120 152,180 138,235 Z" fill="url(#pruSilver)"/>
    
    <!-- Neck & Lid -->
    <rect x="70" y="70" width="60" height="22" rx="3" fill="url(#pruSilver)"/>
    <path d="M72,70 C72,40 128,40 128,70 Z" fill="url(#pruSilver)"/>
    <circle cx="100" cy="35" r="9" fill="#FFD54F"/>

    <!-- Left Scroll Handle -->
    <path d="M58,110 C22,95 22,180 62,195" fill="none" stroke="url(#pruSilver)" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Right Scroll Handle -->
    <path d="M142,110 C178,95 178,180 138,195" fill="none" stroke="url(#pruSilver)" stroke-width="11" stroke-linecap="round"/>
  </g>
</svg>
