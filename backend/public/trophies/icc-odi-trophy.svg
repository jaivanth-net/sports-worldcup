<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="160" height="260">
  <defs>
    <linearGradient id="goldGlobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FBC02D"/>
      <stop offset="70%" stop-color="#F57F17"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="silverColumn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFD8DC"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#90A4AE"/>
      <stop offset="100%" stop-color="#546E7A"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <ellipse cx="80" cy="235" rx="55" ry="12" fill="url(#silverColumn)"/>
  <rect x="35" y="215" width="90" height="18" rx="4" fill="url(#silverColumn)"/>

  <!-- 3 Sweeping Hardwood/Silver Columns -->
  <!-- Left Column -->
  <path d="M45,215 Q40,150 62,75 Q68,75 58,215 Z" fill="url(#silverColumn)"/>
  <!-- Center Column -->
  <path d="M74,215 Q80,140 80,70 Q86,140 86,215 Z" fill="url(#silverColumn)"/>
  <!-- Right Column -->
  <path d="M115,215 Q120,150 98,75 Q92,75 102,215 Z" fill="url(#silverColumn)"/>

  <!-- Top Golden Globe (Seam lines like cricket ball) -->
  <circle cx="80" cy="50" r="34" fill="url(#goldGlobe)"/>
  <!-- Cricket Seam on Globe -->
  <path d="M52,40 C65,30 95,30 108,40" fill="none" stroke="#FFF59D" stroke-width="3" stroke-dasharray="3,2"/>
  <path d="M52,60 C65,70 95,70 108,60" fill="none" stroke="#FFF59D" stroke-width="3" stroke-dasharray="3,2"/>
</svg>
