<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="fifaGoldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="55%" stop-color="#FFB300"/>
      <stop offset="80%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="fifaGoldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="malachiteBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00332C"/>
      <stop offset="20%" stop-color="#00695C"/>
      <stop offset="40%" stop-color="#004D40"/>
      <stop offset="65%" stop-color="#00897B"/>
      <stop offset="85%" stop-color="#004D40"/>
      <stop offset="100%" stop-color="#002520"/>
    </linearGradient>
    <radialGradient id="globeShine" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="40%" stop-color="#FFD54F"/>
      <stop offset="80%" stop-color="#FF8F00"/>
      <stop offset="100%" stop-color="#B78103"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Base Malachite Bands -->
    <rect x="40" y="262" width="120" height="18" rx="4" fill="url(#malachiteBand)"/>
    <rect x="48" y="246" width="104" height="16" rx="3" fill="url(#fifaGoldMain)"/>
    <rect x="44" y="230" width="112" height="16" rx="3" fill="url(#malachiteBand)"/>
    <rect x="52" y="218" width="96" height="12" rx="2" fill="url(#fifaGoldMain)"/>

    <!-- Stem & Spiraling Figures -->
    <path d="M64,218 C64,175 48,140 65,100 C72,82 78,65 100,65 C122,65 128,82 135,100 C152,140 136,175 136,218 Z" fill="url(#fifaGoldMain)"/>

    <!-- Left Athlete Figure Arm Swirl -->
    <path d="M65,200 Q78,155 60,115 C52,98 65,80 82,75 C70,98 84,138 72,200 Z" fill="url(#fifaGoldHighlight)" opacity="0.9"/>
    
    <!-- Right Athlete Figure Arm Swirl -->
    <path d="M135,200 Q122,155 140,115 C148,98 135,80 118,75 C130,98 116,138 128,200 Z" fill="url(#fifaGoldHighlight)" opacity="0.9"/>

    <!-- Globe Body -->
    <circle cx="100" cy="50" r="38" fill="url(#globeShine)"/>

    <!-- Latitude lines on Globe -->
    <path d="M65,40 C80,32 120,32 135,40" fill="none" stroke="#B78103" stroke-width="2.5" opacity="0.7"/>
    <path d="M63,52 C80,62 120,62 137,52" fill="none" stroke="#B78103" stroke-width="2.5" opacity="0.7"/>

    <!-- Continents Silhouette -->
    <path d="M78,35 C88,28 108,30 118,36 C124,42 122,54 112,60 C98,68 85,62 76,50 Z" fill="#FFE082" opacity="0.5"/>
  </g>
</svg>
