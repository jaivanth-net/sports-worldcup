<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <defs>
    <linearGradient id="julesGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="30%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="lapisBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A192F"/>
      <stop offset="30%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="shadowJules" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadowJules)">
    <!-- Blue Lapis Lazuli Octagonal Base -->
    <polygon points="50,275 150,275 165,225 35,225" fill="url(#lapisBase)"/>
    <polygon points="58,225 142,225 135,210 65,210" fill="url(#julesGold)"/>
    <rect x="52" y="270" width="96" height="5" fill="#3B82F6" opacity="0.6"/>

    <!-- Winged Goddess Nike Body -->
    <path d="M85,210 L115,210 L112,150 C125,130 135,100 120,70 L100,90 L80,70 C65,100 75,130 88,150 Z" fill="url(#julesGold)"/>

    <!-- Left Wing -->
    <path d="M80,145 C55,120 40,85 48,60 C68,78 78,102 90,120 Z" fill="url(#julesGold)"/>
    
    <!-- Right Wing -->
    <path d="M120,145 C145,120 160,85 152,60 C132,78 122,102 110,120 Z" fill="url(#julesGold)"/>

    <!-- Octagonal Gold Vessel Cup -->
    <polygon points="55,60 145,60 160,18 40,18" fill="url(#julesGold)"/>
    <rect x="48" y="12" width="104" height="6" fill="#FFFDE7"/>
  </g>
</svg>
