<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="160" height="260">
  <defs>
    <linearGradient id="crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="50%" stop-color="#80DEEA"/>
      <stop offset="100%" stop-color="#0097A7"/>
    </linearGradient>
  </defs>

  <!-- Black Octagonal Base -->
  <polygon points="45,240 115,240 130,170 30,170" fill="#212121"/>
  <polygon points="35,170 125,170 115,155 45,155" fill="#424242"/>

  <!-- Crystal Globe -->
  <circle cx="80" cy="90" r="55" fill="url(#crystal)" opacity="0.85"/>
  <!-- Facet crystal cuts -->
  <path d="M40,90 L120,90 M80,35 L80,145 M50,55 L110,125 M50,125 L110,55" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>
  <circle cx="80" cy="90" r="40" fill="none" stroke="#E0F7FA" stroke-width="2"/>
</svg>
