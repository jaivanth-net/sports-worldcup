<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="40%" stop-color="#0a1326"/>
      <stop offset="100%" stop-color="#0f1c30"/>
    </linearGradient>

    <!-- Floodlight Beams Gradient -->
    <radialGradient id="lightBeam1" cx="15%" cy="10%" r="70%">
      <stop offset="0%" stop-color="rgba(255, 230, 150, 0.45)"/>
      <stop offset="35%" stop-color="rgba(251, 191, 36, 0.15)"/>
      <stop offset="100%" stop-color="rgba(5, 10, 20, 0)"/>
    </radialGradient>

    <radialGradient id="lightBeam2" cx="85%" cy="10%" r="70%">
      <stop offset="0%" stop-color="rgba(255, 230, 150, 0.45)"/>
      <stop offset="35%" stop-color="rgba(251, 191, 36, 0.15)"/>
      <stop offset="100%" stop-color="rgba(5, 10, 20, 0)"/>
    </radialGradient>

    <!-- Outfield Grass Oval Gradient -->
    <radialGradient id="grassGrad" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#1b4d2e"/>
      <stop offset="50%" stop-color="#113820"/>
      <stop offset="100%" stop-color="#0a2113"/>
    </radialGradient>

    <!-- Pitch Strip Gradient -->
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a38258"/>
      <stop offset="50%" stop-color="#c4a47c"/>
      <stop offset="100%" stop-color="#8c6d46"/>
    </linearGradient>

    <!-- Stadium Crowd Tier Glow -->
    <linearGradient id="stadiumTier" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Floodlight Flares & Beams -->
  <rect width="1920" height="1080" fill="url(#lightBeam1)"/>
  <rect width="1920" height="1080" fill="url(#lightBeam2)"/>

  <!-- Floodlight Towers (Top Left & Top Right) -->
  <g opacity="0.85">
    <!-- Left Tower -->
    <line x1="200" y1="220" x2="160" y2="450" stroke="#334155" stroke-width="4"/>
    <line x1="280" y1="220" x2="320" y2="450" stroke="#334155" stroke-width="4"/>
    <path d="M180 220 H300 V180 H180 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <!-- Bulbs -->
    <circle cx="200" cy="200" r="10" fill="#fffef0" filter="drop-shadow(0 0 10px #fbbf24)"/>
    <circle cx="240" cy="200" r="10" fill="#fffef0" filter="drop-shadow(0 0 10px #fbbf24)"/>
    <circle cx="280" cy="200" r="10" fill="#fffef0" filter="drop-shadow(0 0 10px #fbbf24)"/>

    <!-- Right Tower -->
    <line x1="1640" y1="220" x2="1600" y2="450" stroke="#334155" stroke-width="4"/>
    <line x1="1720" y1="220" x2="1760" y2="450" stroke="#334155" stroke-width="4"/>
    <path d="M1620 220 H1740 V180 H1620 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <!-- Bulbs -->
    <circle cx="1640" cy="200" r="10" fill="#fffef0" filter="drop-shadow(0 0 10px #fbbf24)"/>
    <circle cx="1680" cy="200" r="10" fill="#fffef0" filter="drop-shadow(0 0 10px #fbbf24)"/>
    <circle cx="1720" cy="200" r="10" fill="#fffef0" filter="drop-shadow(0 0 10px #fbbf24)"/>
  </g>

  <!-- Stadium Stands / Bowl -->
  <ellipse cx="960" cy="780" rx="980" ry="420" fill="url(#stadiumTier)"/>
  <ellipse cx="960" cy="800" rx="920" ry="380" fill="rgba(15, 23, 42, 0.8)"/>

  <!-- Crowd Lights shimmer -->
  <g opacity="0.3">
    <circle cx="400" cy="500" r="1" fill="#fff"/><circle cx="450" cy="520" r="1.5" fill="#fbbf24"/><circle cx="520" cy="490" r="1" fill="#fff"/>
    <circle cx="1400" cy="500" r="1" fill="#fff"/><circle cx="1480" cy="530" r="1.5" fill="#fbbf24"/><circle cx="1350" cy="490" r="1" fill="#fff"/>
  </g>

  <!-- Outfield Grass (Cricket Oval) -->
  <ellipse cx="960" cy="880" rx="840" ry="320" fill="url(#grassGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
  
  <!-- Boundary Rope -->
  <ellipse cx="960" cy="880" rx="780" ry="290" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="12 6" opacity="0.6"/>
  <ellipse cx="960" cy="880" rx="600" ry="220" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="6 4"/>

  <!-- 30-Yard Circle -->
  <ellipse cx="960" cy="880" rx="380" ry="140" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Cricket Pitch Strip (Center) -->
  <polygon points="920,810 1000,810 1010,950 910,950" fill="url(#pitchGrad)" stroke="#785935" stroke-width="2"/>

  <!-- Popping Creases & Wickets -->
  <line x1="930" y1="830" x2="990" y2="830" stroke="#ffffff" stroke-width="2"/>
  <line x1="925" y1="930" x2="995" y2="930" stroke="#ffffff" stroke-width="2"/>
  <!-- Wickets -->
  <line x1="955" y1="822" x2="955" y2="830" stroke="#fbbf24" stroke-width="2"/>
  <line x1="960" y1="822" x2="960" y2="830" stroke="#fbbf24" stroke-width="2"/>
  <line x1="965" y1="822" x2="965" y2="830" stroke="#fbbf24" stroke-width="2"/>

  <line x1="955" y1="930" x2="955" y2="938" stroke="#fbbf24" stroke-width="2"/>
  <line x1="960" y1="930" x2="960" y2="938" stroke="#fbbf24" stroke-width="2"/>
  <line x1="965" y1="930" x2="965" y2="938" stroke="#fbbf24" stroke-width="2"/>

  <!-- Soft Dark Overlay Vignette for perfect readability -->
  <rect width="1920" height="1080" fill="rgba(9, 13, 22, 0.65)"/>
</svg>
