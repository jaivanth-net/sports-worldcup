<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night Sky Gradient -->
    <linearGradient id="fbSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#040d1a"/>
      <stop offset="40%" stop-color="#081b33"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>

    <!-- Stadium Floodlight Beams (Neon Blue Tint) -->
    <radialGradient id="fbLightBeam1" cx="15%" cy="10%" r="75%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="40%" stop-color="rgba(14, 165, 233, 0.12)"/>
      <stop offset="100%" stop-color="rgba(4, 13, 26, 0)"/>
    </radialGradient>

    <radialGradient id="fbLightBeam2" cx="85%" cy="10%" r="75%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="40%" stop-color="rgba(14, 165, 233, 0.12)"/>
      <stop offset="100%" stop-color="rgba(4, 13, 26, 0)"/>
    </radialGradient>

    <!-- Football Pitch Grass Gradient -->
    <linearGradient id="fbPitchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f512c"/>
      <stop offset="50%" stop-color="#146c38"/>
      <stop offset="100%" stop-color="#0a3d20"/>
    </linearGradient>

    <!-- Pattern for Grass Strips -->
    <pattern id="turfPattern" width="80" height="1080" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="1080" fill="rgba(255,255,255,0.03)"/>
      <rect x="40" y="0" width="40" height="1080" fill="rgba(0,0,0,0.03)"/>
    </pattern>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#fbSkyGrad)"/>

  <!-- Floodlight Beams -->
  <rect width="1920" height="1080" fill="url(#fbLightBeam1)"/>
  <rect width="1920" height="1080" fill="url(#fbLightBeam2)"/>

  <!-- Floodlight Towers -->
  <g opacity="0.85">
    <!-- Left Tower -->
    <line x1="180" y1="200" x2="140" y2="440" stroke="#1e293b" stroke-width="5"/>
    <line x1="260" y1="200" x2="300" y2="440" stroke="#1e293b" stroke-width="5"/>
    <path d="M160 200 H280 V160 H160 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="180" cy="180" r="10" fill="#e0f2fe" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <circle cx="220" cy="180" r="10" fill="#e0f2fe" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <circle cx="260" cy="180" r="10" fill="#e0f2fe" filter="drop-shadow(0 0 10px #38bdf8)"/>

    <!-- Right Tower -->
    <line x1="1660" y1="200" x2="1620" y2="440" stroke="#1e293b" stroke-width="5"/>
    <line x1="1740" y1="200" x2="1780" y2="440" stroke="#1e293b" stroke-width="5"/>
    <path d="M1640 200 H1760 V160 H1640 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="1660" cy="180" r="10" fill="#e0f2fe" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <circle cx="1700" cy="180" r="10" fill="#e0f2fe" filter="drop-shadow(0 0 10px #38bdf8)"/>
    <circle cx="1740" cy="180" r="10" fill="#e0f2fe" filter="drop-shadow(0 0 10px #38bdf8)"/>
  </g>

  <!-- Stadium Stands / Tier Contour -->
  <polygon points="100,520 1820,520 1920,680 0,680" fill="rgba(15, 23, 42, 0.9)"/>
  <polygon points="0,660 1920,660 1920,1080 0,1080" fill="url(#fbPitchGrad)"/>
  <polygon points="0,660 1920,660 1920,1080 0,1080" fill="url(#turfPattern)"/>

  <!-- Football Pitch Lines (Perspective View) -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.75" fill="none">
    <!-- Touchline / Boundary -->
    <polygon points="180,680 1740,680 1900,1040 20,1040"/>

    <!-- Halfway Line -->
    <line x1="960" y1="680" x2="960" y2="1040"/>

    <!-- Center Circle -->
    <ellipse cx="960" cy="860" rx="200" ry="85"/>
    <circle cx="960" cy="860" r="5" fill="#ffffff"/>

    <!-- Penalty Box (Foreground) -->
    <polygon points="680,1040 1240,1040 1200,940 720,940"/>
    <!-- Goal Area -->
    <polygon points="800,1040 1120,1040 1100,990 820,990"/>
    <!-- Penalty Spot -->
    <circle cx="960" cy="970" r="4" fill="#ffffff"/>

    <!-- Goal Posts in Distance -->
    <path d="M880,680 V640 H1040 V680" stroke="#ffffff" stroke-width="4" stroke-dasharray="0"/>
    <!-- Net -->
    <path d="M880,640 L890,630 H1030 L1040,640 M890,630 V675 M1030,630 V675" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Soft Dark Overlay Vignette for perfect readability -->
  <rect width="1920" height="1080" fill="rgba(9, 13, 22, 0.65)"/>
</svg>
